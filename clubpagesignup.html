<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Club Sign Up Sheet</title>
</head>
<body>
    <h1>Welcome to the Drum Club Sign Up Page!</h1>
    <h2>Input a few details to officially sign up for our club.</h2>
<div>
    <form method="get" action="example.html">
        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email" placeholder="ex: S_first.last@ousd.org"><br><br>
        <label for="Student ID">Student ID:</label>
        <input type="text" id="Student ID" name="Student ID" placeholder="6 digits, without the 00s"><br><br>
        <label for="Favorite" id="Favorite">Favorite Drum Part (or brand):</label>
        <input type="text" id="Favorite" name="Favorite" placeholder="ex: Zilidjian"><br><br>
        <label for="Experience">Years You've Been Playing For</label>
        <input type="text" id="Experience" name="Experience" placeholder="ex: 1, four"><br><br> 
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</div>
</div>
</body>
</html>
