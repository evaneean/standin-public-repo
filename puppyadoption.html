<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Puppy Adoption Page</h1>
    <h2>Please enter your information to adopt a puppy and we'll email you back.</h2>
    <p>Please note that First Name, Last Name, Password and Email are required.</p>
    <form method="get">
     <label for="First Name">First Name:</label>
        <input type="text" id="First Name" name="First Name" placeholder="First Name">
         <label for="Last Name">Last Name:</label>
        <input type="text" id="Last Name" name="Last Name" placeholder="Last Name"><br><br>
         <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email" placeholder="name@email.com">
</body> <label for="Password">Password:</label>
        <input type="text" id="Password" name="Password"><br><br>
        <p>Are you over the age of 18?</p>
        <label for="Yes">Yes:</label>
        <input type="radio" id="Yes" name="Yes">
        <label for="No">No:</label>
        <input type="radio" id="No" name="No"><br><br>
        <p>Do you have a credit card or a Paypal?</p>
        <select name="Payment">
            <option value="Credit">Credit Card</option>
            <option value="Paypal">Paypal</option>
        </select><br><br>
        <input type="submit" name="Submit" value="Submit Feedback">
        <input type="reset" name="Reset" value="Reset Info">
    </form>
</body>
</html>
